<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | Alpha Intern</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="title">
            <h1>Calculator</h1>
            <p>Alpha Intern - Task 2</p>
        </div>

        <!-- Display -->
        <div class="display">
            <div id="previousDisplay"></div>
            <div id="currentDisplay">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteNumber()">DEL</button>
            <button onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('÷')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('×')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>

    <footer>
        <p>© 2026 Alpha Intern | Calculator Task</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
