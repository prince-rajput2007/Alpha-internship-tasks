<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery | Alpha Intern</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>Image Gallery</h1>
        <p>Explore beautiful moments through images</p>
    </header>

    <!-- Category Filters -->
    <section class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="city">City</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
    </section>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Nature">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b"
                 alt="Mountain Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                 alt="City">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000"
                 alt="City Street">
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
                 alt="Travel">
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828"
                 alt="Travel Destination">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close-btn" id="closeBtn">&times;</button>

        <button class="nav-btn prev-btn" id="prevBtn">
            &#10094;
        </button>

        <img id="lightboxImage" src="" alt="Preview">

        <button class="nav-btn next-btn" id="nextBtn">
            &#10095;
        </button>

    </div>

    <footer>
        <p>© 2026 Image Gallery | Alpha Intern Task 1</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
